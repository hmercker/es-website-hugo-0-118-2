[build]
  command = "hugo --gc --minify && rm -rf public/5-es-al-fike"
  publish = "public"

[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_URL && rm -rf public/5-es-al-fike"

[context.production.environment]
  HUGO_VERSION = "0.51"
  HUGO_EXTENDED = "true"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PREVIEW && rm -rf public/5-es-al-fike"
