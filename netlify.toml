[build]
  publish = "public"
  command = "hugo --baseURL $URL"

[build.environment]
  HUGO_VERSION = "0.145.0"
  HUGO_EXTENDED = "true"

[context.deploy-preview]
  command = "hugo --baseURL $DEPLOY_URL"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.145.0"
  HUGO_EXTENDED = "true"

[context.production.environment]
  HUGO_VERSION = "0.145.0"
  HUGO_EXTENDED = "true"

[context.branch-deploy]
  command = "hugo --baseURL $DEPLOY_PREVIEW"

[context.branch-deploy.environment]
  HUGO_VERSION = "0.145.0"
  HUGO_EXTENDED = "true"

[[redirects]]
  from = "/*/es-al-fike/*"
  to = "/404"
  status = 404
