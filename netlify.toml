[build]
  command = "node_modules/.bin/sass themes/newbirth/assets/scss/newbirth.scss static/css/newbirth.css && hugo --gc --minify -b $URL"
  publish = "public"
  environment = { NODE_VERSION = "18", HUGO_VERSION = "0.51" }


[context.deploy-preview]
  command = "hugo -b $DEPLOY_URL"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.51"
  HUGO_EXTENDED = "true"

[context.production.environment]
  HUGO_VERSION = "0.51"
  HUGO_EXTENDED = "true"
  HUGO_ENV = "production"

[context.branch-deploy]
  command = "hugo -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
  HUGO_VERSION = "0.51"
  HUGO_EXTENDED = "true"
