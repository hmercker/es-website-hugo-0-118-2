# netlify.toml — Hugo site
[build]
  publish = "public"
  command = "hugo"

[build.environment]
  HUGO_VERSION = "0.118.2"
  HUGO_ENV = "production"
  TZ = "UTC"                 # or "Africa/Windhoek" if you prefer local time

# Use the deploy URL as the base for preview/branch builds so links resolve correctly
[context.deploy-preview]
  command = "hugo -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo -b $DEPLOY_PRIME_URL"

# Production: enable minification on the final site
[context.production]
  command = "hugo --minify"

[context.production.environment]
  HUGO_IS_SERVER = "false"

[context.deploy-preview.environment]
  HUGO_IS_SERVER = "true"

[context.branch-deploy.environment]
  HUGO_IS_SERVER = "true"
