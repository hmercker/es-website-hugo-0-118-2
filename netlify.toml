# netlify.toml — Hugo site
[build]
  publish = "public"
  command = "hugo"

[build.environment]
  HUGO_VERSION = "0.118.2"
  HUGO_ENV = "production"
  TZ = "UTC"                 # or "Africa/Windhoek" if you prefer local time

# Use the deploy URL as the base for preview/branch builds so links resolve correctly
[context.deploy-preview]
  command = "hugo -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo -b $DEPLOY_PRIME_URL"

# Production: enable minification on the final site
[context.production]
  command = "hugo --gc --minify"

# Browser caching (added for page speed).
# CSS and JS file names contain a fingerprint that changes whenever the file changes,
# and the font files never change, so browsers may keep them for a year.
[[headers]]
for = "/css/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/js/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Images keep their names when replaced, so browsers keep them for 7 days only.
[[headers]]
for = "/images/*"
[headers.values]
  Cache-Control = "public, max-age=604800"
