[build]
  publish = "public"
  command = "hugo --gc --minify -b $URL"
  command = "sass themes/newbirth/assets/scss/newbirth.scss themes/newbirth/assets/css/newbirth.css && hugo"
  publish = "public"


[context.deploy-preview]
  command = "hugo -b $DEPLOY_URL"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.51"
  HUGO_EXTENDED = "true"

[context.production.environment]
  HUGO_VERSION = "0.51"
  HUGO_EXTENDED = "true"
  HUGO_ENV = "production"

[context.branch-deploy]
  command = "hugo -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
  HUGO_VERSION = "0.51"
  HUGO_EXTENDED = "true"
